name: Build & Deploy

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/infinityx

    outputs:
      image_tag: ${{ steps.tags.outputs.deploy_tag }}
      environment: ${{ steps.env.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set image tags (immutable deploy tags)
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Production: deploy immutable SHA tag, also publish latest for convenience
            echo "deploy_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "all_tags=${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.IMAGE_NAME }}:${SHORT_SHA}" >> $GITHUB_OUTPUT

          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            # Staging: deploy immutable-ish tag tied to commit
            echo "deploy_tag=develop-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "all_tags=${{ env.IMAGE_NAME }}:develop,${{ env.IMAGE_NAME }}:develop-${SHORT_SHA},${{ env.IMAGE_NAME }}:develop-${{ github.sha }}" >> $GITHUB_OUTPUT

          else
            # PR: build-only, tag by PR number
            echo "deploy_tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "all_tags=${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.all_tags }}
          build-args: |
            PHP_VERSION=8.3
            VITE_APP_NAME=Portfolio
            VITE_PUSHER_APP_KEY=${{ secrets.VITE_PUSHER_APP_KEY }}
            VITE_PUSHER_APP_CLUSTER=${{ secrets.VITE_PUSHER_APP_CLUSTER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image build summary
        run: |
          echo "## 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy tag:** \`${{ steps.tags.outputs.deploy_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**All tags:** \`${{ steps.tags.outputs.all_tags }}\`" >> $GITHUB_STEP_SUMMARY

  trigger-deployment:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.build-and-push.outputs.environment != ''

    steps:
      - name: Trigger Ansible deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_PAT }}
          # IMPORTANT: set this to your infra repo that contains the Deploy Application workflow
          repository: codedsultan/x-infra
          event-type: deploy-app
          client-payload: |
            {
              "app_name": "codesultan",
              "environment": "${{ needs.build-and-push.outputs.environment }}",
              "tag": "${{ needs.build-and-push.outputs.image_tag }}",
              "commit_sha": "${{ github.sha }}",
              "commit_message": "${{ github.event.head_commit.message }}",
              "triggered_by": "${{ github.actor }}",
              "repo": "${{ github.repository }}",
              "run_id": "${{ github.run_id }}"
            }

      - name: Deployment triggered
        run: |
          echo "## 🚀 Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.build-and-push.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Track progress:** https://github.com/codedsultan/xurl-infra-2/actions" >> $GITHUB_STEP_SUMMARY
